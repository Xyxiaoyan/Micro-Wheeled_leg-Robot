; =============================================================================
; PlatformIO project configuration – Micro-Wheeled-Leg Robot (STM32F407 port)
; =============================================================================
;
; Targets:
;   disco_f407vg       – STM32F407VG Discovery board (upload via ST-Link)
;   genericSTM32F407   – Custom PCB with STM32F407VGT6 (upload via DFU or ST-Link)
;
; Usage:
;   pio run -e disco_f407vg          # build for Discovery
;   pio run -e disco_f407vg -t upload  # build + flash
;   pio device monitor               # open serial monitor (115200 baud)
; =============================================================================

[platformio]
default_envs = disco_f407vg

; ─── Shared settings ──────────────────────────────────────────────────────────
[env]
platform  = ststm32
framework = arduino

; Serial monitor baud rate (Commander / debug output)
monitor_speed = 115200

; Library dependencies
lib_deps =
    askuric/Simple FOC @ ^2.3.3
    tockn/MPU6050_tockn @ ^1.1.0

; Build flags applied to all environments:
;   -DUSBD_USE_CDC  routes Arduino "Serial" to the USB Virtual COM port so the
;                   SimpleFOC Commander works over the same USB cable used for
;                   flashing.  Remove this flag and add a HardwareSerial object
;                   on PA2/PA3 (USART2) if you prefer a dedicated UART console.
build_flags =
    -DUSBD_USE_CDC
    -DHAL_PCD_MODULE_ENABLED

; ─── STM32F407VG Discovery board ─────────────────────────────────────────────
[env:disco_f407vg]
board           = disco_f407vg
upload_protocol = stlink
debug_tool      = stlink

; ─── Generic STM32F407VGT6 (custom PCB) ──────────────────────────────────────
; Uncomment and adjust for a custom board.
;
; [env:genericSTM32F407]
; board               = genericSTM32F407VGT6
; upload_protocol     = dfu      ; use DFU bootloader
; ; upload_protocol   = stlink   ; or use ST-Link/J-Link
; board_build.f_cpu   = 168000000L
